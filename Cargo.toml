[package]
name = "nso-gc-bridge"
version = "0.1.0"
edition = "2024"
description = "Switch 2 NSO GameCube controller over Bluetooth LE as a virtual Xbox 360 pad (Steam Frame / Linux and Windows)"
license = "Apache-2.0"
repository = "https://github.com/MichaelScottsman/nso-frame-bridge"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
futures = "0.3.34"
log = "0.4.34"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
uuid = "1.28.0"

[target."cfg(windows)".dependencies]
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows = { version = "0.62", features = ["Devices_Bluetooth", "Foundation"] }
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
libc = "0.2.190"
